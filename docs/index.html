<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Group Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #1a1d23; color: #e0e0e0; height: 100vh; overflow: hidden; }

  /* ── 配置页 ── */
  #setup-page { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 14px; }
  #setup-page h1 { font-size: 26px; margin-bottom: 4px; }
  #setup-page .sub { color: #888; font-size: 14px; }
  #setup-page input { padding: 11px 16px; border-radius: 8px; border: 1px solid #333; background: #2a2d33; color: #fff; width: 340px; font-size: 14px; }
  #setup-page input:focus { outline: none; border-color: #5b8def; }
  #setup-page button { padding: 11px 28px; border-radius: 8px; border: none; background: #5b8def; color: #fff; cursor: pointer; font-size: 14px; }
  #setup-page button:hover { background: #4a7de0; }
  #setup-error { color: #e06c6c; font-size: 13px; min-height: 18px; }

  /* ── 主界面 ── */
  #main-page { display: none; height: 100vh; }

  .layout { display: flex; height: 100%; }

  /* 左侧栏 */
  .sidebar { width: 240px; background: #22252b; border-right: 1px solid #333; display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-header { padding: 14px 16px; font-weight: 600; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
  .settings-link { font-size: 12px; color: #888; background: none; border: none; cursor: pointer; }
  .settings-link:hover { color: #fff; }
  .group-list { flex: 1; overflow-y: auto; padding: 8px; }
  .group-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 2px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  .group-item:hover { background: #2a2d33; }
  .group-item.active { background: #3a4050; }
  .group-info { flex: 1; min-width: 0; }
  .group-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .group-meta { font-size: 11px; color: #888; margin-top: 2px; }
  .group-actions { display: none; gap: 4px; flex-shrink: 0; }
  .group-item:hover .group-actions { display: flex; }
  .icon-btn { background: none; border: none; color: #888; cursor: pointer; font-size: 13px; padding: 2px 4px; border-radius: 3px; }
  .icon-btn:hover { color: #fff; background: #444; }
  .icon-btn.danger:hover { color: #e06c6c; }
  .new-group-btn { margin: 8px; padding: 10px; border: 1px dashed #555; border-radius: 6px; text-align: center; cursor: pointer; font-size: 13px; color: #aaa; }
  .new-group-btn:hover { border-color: #888; color: #fff; }

  /* 中间聊天区 */
  .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-header { padding: 12px 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
  .chat-title { font-weight: 600; font-size: 15px; }
  .chat-sub { font-size: 11px; color: #888; margin-top: 2px; }
  .status-group { font-size: 12px; color: #888; display: flex; gap: 14px; }
  .status-ok { color: #4caf50; }
  .status-warn { color: #ff9800; }
  .status-err { color: #e06c6c; }

  .announcement-bar { padding: 8px 20px; background: #2a2d33; border-bottom: 1px solid #333; font-size: 12px; color: #888; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .announcement-bar:hover { color: #ccc; }
  .announcement-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }

  .messages { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { margin-bottom: 14px; max-width: 72%; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .msg-user { margin-left: auto; }
  .msg-system { max-width: 100%; margin: 10px auto; text-align: center; }
  .msg-meta { font-size: 11px; color: #888; margin-bottom: 4px; }
  .msg-bubble { padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg-user .msg-bubble { background: #5b8def; color: #fff; border-bottom-right-radius: 2px; }
  .msg-agent .msg-bubble { background: #2a2d33; border-bottom-left-radius: 2px; }
  .msg-system .msg-bubble { background: transparent; color: #777; font-style: italic; font-size: 13px; padding: 0; }

  .typing-indicator { padding: 6px 20px; font-size: 13px; color: #888; font-style: italic; }
  .typing-dots::after { content: ''; animation: dots 1.5s steps(4, end) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

  .input-area { padding: 14px 20px; border-top: 1px solid #333; display: flex; gap: 10px; }
  .input-area textarea { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #333; background: #2a2d33; color: #fff; font-size: 14px; resize: none; height: 44px; font-family: inherit; }
  .input-area textarea:focus { outline: none; border-color: #5b8def; }
  .input-area button { padding: 0 22px; border-radius: 8px; border: none; background: #5b8def; color: #fff; cursor: pointer; font-size: 14px; }
  .input-area button:hover { background: #4a7de0; }

  /* 右侧栏 */
  .rightbar { width: 260px; background: #22252b; border-left: 1px solid #333; display: flex; flex-direction: column; flex-shrink: 0; }
  .rightbar-section { padding: 14px 16px; border-bottom: 1px solid #333; overflow-y: auto; }
  .rightbar-section:last-child { border-bottom: none; flex: 1; }
  .rightbar h3 { font-size: 12px; color: #888; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center; }
  .add-btn { font-size: 16px; color: #888; background: none; border: none; cursor: pointer; padding: 0 2px; line-height: 1; }
  .add-btn:hover { color: #fff; }
  .member-item { padding: 6px 0; font-size: 13px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .member-left { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
  .member-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .member-status { font-size: 10px; color: #888; flex-shrink: 0; }
  .member-status.thinking { color: #ff9800; }
  .member-status.replying { color: #4caf50; }
  .member-status.error { color: #e06c6c; }
  .remove-btn { background: none; border: none; color: #666; cursor: pointer; font-size: 12px; padding: 2px; opacity: 0; flex-shrink: 0; }
  .member-item:hover .remove-btn { opacity: 1; }
  .remove-btn:hover { color: #e06c6c; }

  /* 弹窗 */
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 100; align-items: center; justify-content: center; }
  .modal.show { display: flex; }
  .modal-content { background: #2a2d33; border-radius: 12px; padding: 24px; width: 520px; max-height: 85vh; overflow-y: auto; }
  .modal-content h2 { font-size: 17px; margin-bottom: 18px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
  .form-group input, .form-group textarea { width: 100%; background: #1a1d23; color: #fff; border: 1px solid #333; border-radius: 8px; padding: 9px 12px; font-size: 14px; font-family: inherit; }
  .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #5b8def; }
  .form-group textarea { resize: vertical; }
  .form-row { display: flex; gap: 10px; }
  .form-row .form-group { flex: 1; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .btn { padding: 8px 18px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; }
  .btn-primary { background: #5b8def; color: #fff; }
  .btn-primary:hover { background: #4a7de0; }
  .btn-secondary { background: #444; color: #ccc; }
  .btn-secondary:hover { background: #555; }
  .btn-danger { background: #c0392b; color: #fff; }
  .btn-danger:hover { background: #d35400; }

  .empty-state { color: #666; font-size: 13px; text-align: center; padding: 16px 0; }
</style>
</head>
<body>

<!-- 配置页 -->
<div id="setup-page">
  <h1>Agent Group Chat</h1>
  <p class="sub">连接本地后端服务器（先启动 npm run dev）</p>
  <input id="backend-url" placeholder="http://localhost:8787">
  <button onclick="connectBackend()">连接</button>
  <p id="setup-error"></p>
</div>

<!-- 主界面 -->
<div id="main-page">
  <div class="layout">
    <!-- 左侧：群列表 -->
    <div class="sidebar">
      <div class="sidebar-header">
        <span>群聊</span>
        <button class="settings-link" onclick="showSetup()">⚙ 设置</button>
      </div>
      <div class="group-list" id="group-list"></div>
      <div class="new-group-btn" onclick="openGroupModal()">+ 新建群</div>
    </div>

    <!-- 中间：聊天 -->
    <div class="chat-area">
      <div class="chat-header">
        <div>
          <div class="chat-title" id="current-group-name">未选择</div>
          <div class="chat-sub" id="current-group-dir"></div>
        </div>
        <div class="status-group">
          <span id="ws-status">WS: --</span>
          <span id="opencode-status">opencode: --</span>
        </div>
      </div>
      <div class="announcement-bar" onclick="openAnnouncementModal()">
        <span>📋</span>
        <span class="announcement-text" id="announcement-text">点击编辑工作流/群公告</span>
      </div>
      <div class="messages" id="messages"></div>
      <div class="typing-indicator" id="typing-indicator" style="display:none;"></div>
      <div class="input-area">
        <textarea id="input" placeholder="输入消息... @角色名 指定回复，不提则相关角色自动回应" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
        <button onclick="sendMessage()">发送</button>
      </div>
    </div>

    <!-- 右侧：成员 + 角色库 -->
    <div class="rightbar">
      <div class="rightbar-section">
        <h3>群成员</h3>
        <div id="member-list"></div>
      </div>
      <div class="rightbar-section">
        <h3>角色库 <button class="add-btn" onclick="openRoleModal()" title="新建角色">+</button></h3>
        <div id="roles-list"></div>
      </div>
    </div>
  </div>
</div>

<!-- 群弹窗 -->
<div class="modal" id="group-modal">
  <div class="modal-content">
    <h2 id="group-modal-title">新建群</h2>
    <div class="form-group">
      <label>群名称</label>
      <input id="group-name-input" placeholder="例如：电商小程序">
    </div>
    <div class="form-group">
      <label>项目目录（角色干活的文件夹，绝对路径）</label>
      <input id="group-dir-input" placeholder="D:\projects\my-project">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('group-modal')">取消</button>
      <button class="btn btn-primary" onclick="saveGroupModal()">保存</button>
    </div>
  </div>
</div>

<!-- 角色弹窗 -->
<div class="modal" id="role-modal">
  <div class="modal-content">
    <h2 id="role-modal-title">新建角色</h2>
    <div class="form-row">
      <div class="form-group">
        <label>角色名称</label>
        <input id="role-name-input" placeholder="例如：前端开发">
      </div>
      <div class="form-group" style="max-width:90px;">
        <label>Emoji</label>
        <input id="role-emoji-input" placeholder="🎨" maxlength="4">
      </div>
    </div>
    <div class="form-group">
      <label>关键词（空格分隔，用于自动判断相关性）</label>
      <input id="role-desc-input" placeholder="前端 UI 页面 React">
    </div>
    <div class="form-group">
      <label>角色提示词（System Prompt）</label>
      <textarea id="role-prompt-input" rows="7" placeholder="你是一位资深前端开发工程师..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('role-modal')">取消</button>
      <button class="btn btn-primary" onclick="saveRoleModal()">保存</button>
    </div>
  </div>
</div>

<!-- 公告弹窗 -->
<div class="modal" id="announcement-modal">
  <div class="modal-content">
    <h2>📋 群公告 / 工作流提示词</h2>
    <div class="form-group">
      <label>这里写的内容会作为所有角色的协作规则，每次对话都会注入</label>
      <textarea id="announcement-input" rows="10"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('announcement-modal')">取消</button>
      <button class="btn btn-primary" onclick="saveAnnouncementModal()">保存</button>
    </div>
  </div>
</div>

<!-- 确认弹窗 -->
<div class="modal" id="confirm-modal">
  <div class="modal-content" style="width:380px;">
    <h2 id="confirm-title">确认</h2>
    <p id="confirm-message" style="font-size:14px;color:#aaa;"></p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('confirm-modal')">取消</button>
      <button class="btn btn-danger" id="confirm-ok-btn">确定</button>
    </div>
  </div>
</div>

<script>
let backendUrl = '';
let groups = [];
let roles = [];
let currentGroupId = null;
let ws = null;
let agentStates = {};
let editingGroupId = null;
let editingRoleId = null;

// ── API 工具 ──
async function api(path, options = {}) {
  const res = await fetch(backendUrl + path, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || '请求失败 ' + res.status);
  }
  return res.json();
}

// ── 连接后端 ──
async function connectBackend() {
  const url = document.getElementById('backend-url').value.trim().replace(/\/$/, '');
  document.getElementById('setup-error').textContent = '';
  try {
    const res = await fetch(url + '/api/health');
    if (!res.ok) throw new Error();
    const health = await res.json();

    backendUrl = url;
    localStorage.setItem('agc_backend', url);
    document.getElementById('setup-page').style.display = 'none';
    document.getElementById('main-page').style.display = 'block';

    // opencode 状态
    const ocEl = document.getElementById('opencode-status');
    if (health.opencode?.ok) {
      ocEl.innerHTML = 'opencode: <span class="status-ok">✓</span>';
    } else {
      ocEl.innerHTML = 'opencode: <span class="status-warn">⚠ 未安装</span>';
    }

    await loadAll();
  } catch {
    document.getElementById('setup-error').textContent = '无法连接到 ' + url + '，请确认后端已启动（npm run dev）';
  }
}

function showSetup() {
  document.getElementById('main-page').style.display = 'none';
  document.getElementById('setup-page').style.display = 'flex';
  if (ws) { ws.close(); ws = null; }
}

async function loadAll() {
  groups = await api('/api/groups');
  roles = await api('/api/agents');

  if (groups.length && !currentGroupId) currentGroupId = groups[0].id;
  if (currentGroupId && !groups.find(g => g.id === currentGroupId)) {
    currentGroupId = groups[0]?.id || null;
  }

  renderAll();

  if (currentGroupId) await selectGroup(currentGroupId);
}

// ── 渲染 ──
function renderAll() {
  renderGroupList();
  renderMembers();
  renderRolesList();
  renderHeader();
}

function renderHeader() {
  const g = getCurrentGroup();
  document.getElementById('current-group-name').textContent = g?.name || '未选择';
  document.getElementById('current-group-dir').textContent = g?.projectDir || '';
}

function renderGroupList() {
  const el = document.getElementById('group-list');
  if (!groups.length) {
    el.innerHTML = '<div class="empty-state">暂无群聊</div>';
    return;
  }
  el.innerHTML = groups.map(g =>
    '<div class="group-item' + (g.id === currentGroupId ? ' active' : '') + '" onclick="selectGroup(\'' + g.id + '\')">' +
      '<div class="group-info">' +
        '<div class="group-name">' + g.name + '</div>' +
        '<div class="group-meta">' + g.members.length + ' 成员</div>' +
      '</div>' +
      '<div class="group-actions">' +
        '<button class="icon-btn" onclick="event.stopPropagation();openGroupModal(\'' + g.id + '\')" title="编辑">✎</button>' +
        '<button class="icon-btn danger" onclick="event.stopPropagation();confirmDeleteGroup(\'' + g.id + '\')" title="删除">✕</button>' +
      '</div>' +
    '</div>'
  ).join('');
}

function renderMembers() {
  const el = document.getElementById('member-list');
  const g = getCurrentGroup();
  if (!g) { el.innerHTML = '<div class="empty-state">未选择群</div>'; return; }
  if (!g.members.length) { el.innerHTML = '<div class="empty-state">暂无成员<br>从下方添加</div>'; return; }

  el.innerHTML = g.members.map(id => {
    const role = roles.find(r => r.id === id);
    if (!role) return '';
    const st = agentStates[id];
    let statusLabel = '';
    if (st && st.status !== 'idle' && st.status !== 'done') {
      const label = st.status === 'thinking' ? '思考中' : st.status === 'replying' ? '回复中' : '出错';
      statusLabel = '<span class="member-status ' + st.status + '">' + label + '</span>';
    }
    return '<div class="member-item">' +
      '<div class="member-left"><span>' + role.emoji + '</span><span class="member-name">' + role.name + '</span></div>' +
      statusLabel +
      '<button class="remove-btn" onclick="removeMember(\'' + id + '\')" title="移除">✕</button>' +
    '</div>';
  }).join('');
}

function renderRolesList() {
  const el = document.getElementById('roles-list');
  if (!roles.length) { el.innerHTML = '<div class="empty-state">暂无角色</div>'; return; }
  const g = getCurrentGroup();

  el.innerHTML = roles.map(r =>
    '<div class="member-item">' +
      '<div class="member-left"><span>' + r.emoji + '</span><span class="member-name">' + r.name + '</span></div>' +
      '<button class="icon-btn" onclick="openRoleModal(\'' + r.id + '\')" title="编辑">✎</button>' +
      '<button class="icon-btn danger" onclick="confirmDeleteRole(\'' + r.id + '\')" title="删除">✕</button>' +
      (g && !g.members.includes(r.id) ? '<button class="icon-btn" onclick="addMember(\'' + r.id + '\')" title="加入群">+</button>' : '') +
    '</div>'
  ).join('');
}

function getCurrentGroup() {
  return groups.find(g => g.id === currentGroupId);
}

// ── 选择群 ──
async function selectGroup(id) {
  currentGroupId = id;
  agentStates = {};
  renderAll();

  const messages = await api('/api/groups/' + id + '/messages');
  renderMessages(messages);

  const announcement = await api('/api/groups/' + id + '/announcement');
  document.getElementById('announcement-text').textContent = announcement.content || '点击编辑工作流/群公告';

  connectWS(id);
}

function renderMessages(msgs) {
  const el = document.getElementById('messages');
  el.innerHTML = msgs.map(m => msgHtml(m)).join('');
  el.scrollTop = el.scrollHeight;
}

function msgHtml(m) {
  const cls = m.fromType === 'user' ? 'msg msg-user' : m.fromType === 'agent' ? 'msg msg-agent' : 'msg msg-system';
  const time = new Date(m.at).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  return '<div class="' + cls + '">' +
    '<div class="msg-meta">' + m.from + ' · ' + time + '</div>' +
    '<div class="msg-bubble">' + escapeHtml(m.text) + '</div>' +
  '</div>';
}

// ── WebSocket ──
function connectWS(groupId) {
  if (ws) ws.close();
  const proto = backendUrl.startsWith('https') ? 'wss' : 'ws';
  const host = backendUrl.replace(/^https?:\/\//, '');

  ws = new WebSocket(proto + '://' + host + '/ws?group=' + encodeURIComponent(groupId));

  ws.onopen = () => {
    document.getElementById('ws-status').innerHTML = 'WS: <span class="status-ok">✓</span>';
  };
  ws.onclose = () => {
    document.getElementById('ws-status').innerHTML = 'WS: <span class="status-err">✕</span>';
  };
  ws.onmessage = (ev) => {
    const payload = JSON.parse(ev.data);

    if (payload.type === 'message') {
      const el = document.getElementById('messages');
      el.insertAdjacentHTML('beforeend', msgHtml(payload.data));
      el.scrollTop = el.scrollHeight;
    }

    if (payload.type === 'agent_status') {
      agentStates = payload.data;
      renderMembers();
      updateTypingIndicator();
    }

    if (payload.type === 'group_updated' || payload.type === 'group_deleted') {
      loadAll();
    }
  };
}

function updateTypingIndicator() {
  const active = Object.entries(agentStates)
    .filter(([_, s]) => s.status === 'thinking' || s.status === 'replying')
    .map(([id, s]) => {
      const role = roles.find(r => r.id === id);
      return (role?.name || id) + (s.status === 'thinking' ? ' 思考中' : ' 回复中');
    });
  const el = document.getElementById('typing-indicator');
  if (active.length) {
    el.style.display = 'block';
    el.innerHTML = '<span class="typing-dots">' + active.join('，') + '</span>';
  } else {
    el.style.display = 'none';
  }
}

// ── 发消息 ──
async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || !currentGroupId) return;
  input.value = '';

  await api('/api/groups/' + currentGroupId + '/messages', {
    method: 'POST',
    body: JSON.stringify({ text }),
  });
}

// ── 群弹窗 ──
function openGroupModal(id) {
  editingGroupId = id || null;
  if (id) {
    const g = groups.find(g => g.id === id);
    document.getElementById('group-modal-title').textContent = '编辑群';
    document.getElementById('group-name-input').value = g.name;
    document.getElementById('group-dir-input').value = g.projectDir;
  } else {
    document.getElementById('group-modal-title').textContent = '新建群';
    document.getElementById('group-name-input').value = '';
    document.getElementById('group-dir-input').value = '';
  }
  openModal('group-modal');
}

async function saveGroupModal() {
  const name = document.getElementById('group-name-input').value.trim();
  const dir = document.getElementById('group-dir-input').value.trim();
  if (!name || !dir) { alert('名称和目录都要填'); return; }

  try {
    if (editingGroupId) {
      await api('/api/groups/' + editingGroupId, {
        method: 'PATCH',
        body: JSON.stringify({ name, projectDir: dir }),
      });
    } else {
      await api('/api/groups', {
        method: 'POST',
        body: JSON.stringify({ name, projectDir: dir }),
      });
    }
    closeModal('group-modal');
    await loadAll();
  } catch (e) {
    alert(e.message);
  }
}

function confirmDeleteGroup(id) {
  const g = groups.find(g => g.id === id);
  showConfirm('删除群', '确定删除「' + g.name + '」吗？所有聊天记录都会删除，不可恢复。', async () => {
    await api('/api/groups/' + id, { method: 'DELETE' });
    if (currentGroupId === id) currentGroupId = null;
    await loadAll();
  });
}

// ── 成员 ──
async function addMember(roleId) {
  await api('/api/groups/' + currentGroupId + '/members', {
    method: 'POST',
    body: JSON.stringify({ agentId: roleId }),
  });
  await loadAll();
}

async function removeMember(roleId) {
  await api('/api/groups/' + currentGroupId + '/members/' + roleId, {
    method: 'DELETE',
  });
  await loadAll();
}

// ── 角色弹窗 ──
function openRoleModal(id) {
  editingRoleId = id || null;
  if (id) {
    const r = roles.find(r => r.id === id);
    document.getElementById('role-modal-title').textContent = '编辑角色';
    document.getElementById('role-name-input').value = r.name;
    document.getElementById('role-emoji-input').value = r.emoji;
    document.getElementById('role-desc-input').value = r.description;
    document.getElementById('role-prompt-input').value = r.systemPrompt;
  } else {
    document.getElementById('role-modal-title').textContent = '新建角色';
    document.getElementById('role-name-input').value = '';
    document.getElementById('role-emoji-input').value = '🤖';
    document.getElementById('role-desc-input').value = '';
    document.getElementById('role-prompt-input').value = '';
  }
  openModal('role-modal');
}

async function saveRoleModal() {
  const name = document.getElementById('role-name-input').value.trim();
  const emoji = document.getElementById('role-emoji-input').value.trim() || '🤖';
  const description = document.getElementById('role-desc-input').value.trim();
  const systemPrompt = document.getElementById('role-prompt-input').value.trim();
  if (!name) { alert('角色名称要填'); return; }

  try {
    if (editingRoleId) {
      await api('/api/agents/' + editingRoleId, {
        method: 'PATCH',
        body: JSON.stringify({ name, emoji, description, systemPrompt }),
      });
    } else {
      await api('/api/agents', {
        method: 'POST',
        body: JSON.stringify({ name, emoji, description, systemPrompt }),
      });
    }
    closeModal('role-modal');
    await loadAll();
  } catch (e) {
    alert(e.message);
  }
}

function confirmDeleteRole(id) {
  const r = roles.find(r => r.id === id);
  showConfirm('删除角色', '确定删除「' + r.name + '」吗？所有群里的这个角色都会移除。', async () => {
    await api('/api/agents/' + id, { method: 'DELETE' });
    await loadAll();
  });
}

// ── 公告 ──
async function openAnnouncementModal() {
  if (!currentGroupId) return;
  const data = await api('/api/groups/' + currentGroupId + '/announcement');
  document.getElementById('announcement-input').value = data.content || '';
  openModal('announcement-modal');
}

async function saveAnnouncementModal() {
  await api('/api/groups/' + currentGroupId + '/announcement', {
    method: 'PUT',
    body: JSON.stringify({ content: document.getElementById('announcement-input').value }),
  });
  closeModal('announcement-modal');
  const data = await api('/api/groups/' + currentGroupId + '/announcement');
  document.getElementById('announcement-text').textContent = data.content || '点击编辑工作流/群公告';
}

// ── 弹窗工具 ──
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

let confirmCallback = null;
function showConfirm(title, message, cb) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-message').textContent = message;
  confirmCallback = cb;
  document.getElementById('confirm-ok-btn').onclick = () => {
    closeModal('confirm-modal');
    confirmCallback?.();
  };
  openModal('confirm-modal');
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── 启动 ──
window.addEventListener('load', () => {
  const saved = localStorage.getItem('agc_backend');
  if (saved) {
    document.getElementById('backend-url').value = saved;
    connectBackend();
  }
});
</script>
