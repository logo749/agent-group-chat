<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Group Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #1a1d23; color: #e0e0e0; height: 100vh; display: flex; }

  /* 配置页 */
  #setup-page { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 16px; }
  #setup-page h1 { font-size: 24px; margin-bottom: 8px; }
  #setup-page input { padding: 10px 14px; border-radius: 8px; border: 1px solid #333; background: #2a2d33; color: #fff; width: 320px; font-size: 14px; }
  #setup-page button { padding: 10px 24px; border-radius: 8px; border: none; background: #5b8def; color: #fff; cursor: pointer; font-size: 14px; }
  #setup-page button:hover { background: #4a7de0; }

  /* 主界面 */
  #main-page { display: none; flex: 1; }
  .sidebar { width: 220px; background: #22252b; border-right: 1px solid #333; display: flex; flex-direction: column; }
  .sidebar-header { padding: 16px; font-weight: 600; border-bottom: 1px solid #333; }
  .group-list { flex: 1; overflow-y: auto; padding: 8px; }
  .group-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 2px; font-size: 14px; }
  .group-item:hover { background: #2a2d33; }
  .group-item.active { background: #3a4050; }
  .new-group-btn { margin: 8px; padding: 8px; border: 1px dashed #555; border-radius: 6px; text-align: center; cursor: pointer; font-size: 13px; color: #aaa; }
  .new-group-btn:hover { border-color: #888; color: #fff; }

  .chat-area { flex: 1; display: flex; flex-direction: column; }
  .chat-header { padding: 14px 20px; border-bottom: 1px solid #333; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .chat-header .status { font-size: 12px; color: #888; font-weight: normal; }
  .messages { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { margin-bottom: 16px; max-width: 75%; }
  .msg-user { margin-left: auto; }
  .msg-meta { font-size: 12px; color: #888; margin-bottom: 4px; }
  .msg-bubble { padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg-user .msg-bubble { background: #5b8def; color: #fff; border-bottom-right-radius: 2px; }
  .msg-agent .msg-bubble { background: #2a2d33; border-bottom-left-radius: 2px; }
  .msg-system .msg-bubble { background: transparent; color: #888; font-style: italic; text-align: center; max-width: 100%; }

  .input-area { padding: 16px 20px; border-top: 1px solid #333; display: flex; gap: 10px; }
  .input-area textarea { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #333; background: #2a2d33; color: #fff; font-size: 14px; resize: none; height: 44px; font-family: inherit; }
  .input-area button { padding: 0 20px; border-radius: 8px; border: none; background: #5b8def; color: #fff; cursor: pointer; font-size: 14px; }
  .input-area button:hover { background: #4a7de0; }

  .rightbar { width: 240px; background: #22252b; border-left: 1px solid #333; padding: 16px; overflow-y: auto; }
  .rightbar h3 { font-size: 13px; color: #888; margin-bottom: 10px; text-transform: uppercase; }
  .member-item { padding: 6px 0; font-size: 14px; }
</style>
</head>
<body>

<!-- 配置后端地址页 -->
<div id="setup-page">
  <h1>Agent Group Chat</h1>
  <p style="color:#888;font-size:14px;">连接本地后端服务器</p>
  <input id="backend-url" placeholder="http://localhost:8787" value="http://localhost:8787">
  <button onclick="connectBackend()">连接</button>
  <p id="setup-error" style="color:#e06c6c;font-size:13px;"></p>
</div>

<!-- 主界面 -->
<div id="main-page">
  <!-- 左侧：群列表 -->
  <div class="sidebar">
    <div class="sidebar-header">群聊</div>
    <div class="group-list" id="group-list"></div>
    <div class="new-group-btn" onclick="createGroup()">+ 新建群</div>
  </div>

  <!-- 中间：聊天窗口 -->
  <div class="chat-area">
    <div class="chat-header">
      <span id="current-group-name">选择一个群</span>
      <span class="status" id="ws-status">未连接</span>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <textarea id="input" placeholder="输入消息... (@角色名 可以指定回复者)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
      <button onclick="sendMessage()">发送</button>
    </div>
  </div>

  <!-- 右侧：成员列表 -->
  <div class="rightbar">
    <h3>群成员</h3>
    <div id="member-list">（未选择群）</div>
    <h3 style="margin-top:20px;">角色库</h3>
    <div id="roles-list">加载中...</div>
  </div>
</div>

<script>
let backendUrl = '';
let currentGroup = '';
let ws = null;

// ── 连接后端 ──
async function connectBackend() {
  const url = document.getElementById('backend-url').value.trim().replace(/\/$/, '');
  try {
    const res = await fetch(url + '/api/groups');
    if (!res.ok) throw new Error('连接失败');
    backendUrl = url;
    localStorage.setItem('agc_backend', url);
    document.getElementById('setup-page').style.display = 'none';
    document.getElementById('main-page').style.display = 'flex';
    loadGroups();
    loadRoles();
  } catch (e) {
    document.getElementById('setup-error').textContent = '无法连接到 ' + url + '，请确认后端已启动';
  }
}

// ── 群列表 ──
async function loadGroups() {
  const res = await fetch(backendUrl + '/api/groups');
  const groups = await res.json();
  const el = document.getElementById('group-list');
  el.innerHTML = '';
  groups.forEach(g => {
    const div = document.createElement('div');
    div.className = 'group-item' + (g.name === currentGroup ? ' active' : '');
    div.textContent = g.name;
    div.onclick = () => selectGroup(g.name);
    el.appendChild(div);
  });
}

function createGroup() {
  const name = prompt('群名称（项目名）：');
  if (!name) return;
  const dir = prompt('项目文件夹路径（角色干活的地方）：', './projects/' + name);
  if (!dir) return;
  fetch(backendUrl + '/api/groups', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, projectDir: dir })
  }).then(r => r.json()).then(() => {
    loadGroups();
  });
}

// ── 选择群、加载消息 ──
async function selectGroup(name) {
  currentGroup = name;
  document.getElementById('current-group-name').textContent = name;
  document.querySelectorAll('.group-item').forEach(el => el.classList.remove('active'));
  loadGroups();

  // 加载消息
  const res = await fetch(backendUrl + '/api/groups/' + encodeURIComponent(name) + '/messages');
  const msgs = await res.json();
  renderMessages(msgs);

  // 加载成员
  const mres = await fetch(backendUrl + '/api/groups/' + encodeURIComponent(name) + '/members');
  const members = await mres.json();
  document.getElementById('member-list').innerHTML = members.length
    ? members.map(m => '<div class="member-item">' + m + '</div>').join('')
    : '<div style="color:#666;font-size:13px;">暂无成员，从右侧角色库添加</div>';

  // 连接 WebSocket
  connectWS(name);
}

function renderMessages(msgs) {
  const el = document.getElementById('messages');
  el.innerHTML = msgs.map(m => {
    const cls = m.fromType === 'user' ? 'msg msg-user' : m.fromType === 'agent' ? 'msg msg-agent' : 'msg msg-system';
    const time = new Date(m.at).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    return '<div class="' + cls + '">' +
      '<div class="msg-meta">' + m.from + ' · ' + time + '</div>' +
      '<div class="msg-bubble">' + escapeHtml(m.text) + '</div>' +
    '</div>';
  }).join('');
  el.scrollTop = el.scrollHeight;
}

// ── WebSocket ──
function connectWS(group) {
  if (ws) ws.close();
  const proto = backendUrl.startsWith('https') ? 'wss' : 'ws';
  const host = backendUrl.replace(/^https?:\/\//, '');
  ws = new WebSocket(proto + '://' + host + '/ws?group=' + encodeURIComponent(group));
  ws.onopen = () => { document.getElementById('ws-status').textContent = '已连接'; };
  ws.onclose = () => { document.getElementById('ws-status').textContent = '断开'; };
  ws.onmessage = (ev) => {
    const data = JSON.parse(ev.data);
    if (data.type === 'message' && data.group === group) {
      const el = document.getElementById('messages');
      const m = data.data;
      const cls = m.fromType === 'user' ? 'msg msg-user' : m.fromType === 'agent' ? 'msg msg-agent' : 'msg msg-system';
      const time = new Date(m.at).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      el.insertAdjacentHTML('beforeend',
        '<div class="' + cls + '">' +
          '<div class="msg-meta">' + m.from + ' · ' + time + '</div>' +
          '<div class="msg-bubble">' + escapeHtml(m.text) + '</div>' +
        '</div>'
      );
      el.scrollTop = el.scrollHeight;
    }
  };
}

// ── 发消息 ──
async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || !currentGroup) return;
  input.value = '';

  await fetch(backendUrl + '/api/groups/' + encodeURIComponent(currentGroup) + '/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, from: '我' })
  });
}

// ── 角色库 ──
async function loadRoles() {
  const res = await fetch(backendUrl + '/api/roles');
  const roles = await res.json();
  const el = document.getElementById('roles-list');
  if (!roles.length) {
    el.innerHTML = '<div style="color:#666;font-size:13px;">暂无角色，放到 ~/.agc/roles/ 目录</div>';
    return;
  }
  el.innerHTML = roles.map(r =>
    '<div class="member-item">' + r.emoji + ' ' + r.name +
      ' <button onclick="addMember(\'' + r.id + '\')" style="float:right;font-size:11px;cursor:pointer;">+</button>' +
    '</div>'
  ).join('');
}

async function addMember(agentId) {
  if (!currentGroup) return;
  await fetch(backendUrl + '/api/groups/' + encodeURIComponent(currentGroup) + '/members', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ agentId })
  });
  const mres = await fetch(backendUrl + '/api/groups/' + encodeURIComponent(currentGroup) + '/members');
  const members = await mres.json();
  document.getElementById('member-list').innerHTML = members.map(m => '<div class="member-item">' + m + '</div>').join('');
}

// ── 工具 ──
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── 启动时：如果有保存的后端地址，自动连 ──
window.onload = () => {
  const saved = localStorage.getItem('agc_backend');
  if (saved) {
    document.getElementById('backend-url').value = saved;
    connectBackend();
  }
};
</script>
</body>
</html>
